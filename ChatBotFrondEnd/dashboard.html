<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
</head>
<body>
<div>
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatBox_header_contanier">
                <div class="chatbox__header">
                    <div class="chatbox__image--header">
                        <img src="./Images/Chatbot Logo-Header.png" alt="image" width="42" height="42">
                    </div>
                    <div class="chatbox__content--header">
                        <h4 class="chatbox__heading--header">HRMS Chatbot</h4>
                        <p>How may I assist you?</p>
                    </div>
                </div>
                <div class="chatbot_close">
                    <img src="./Images/Collapse_ChatBox.png" alt="closeChtBox" width="25" height="25">
                </div>
            
            </div>
            <div class="chatbox__messages">
                <div></div>
            </div>
            <div class="chatbox__footer">
                <div class="chatbox__footer_Box">
                    <input type="text" placeholder="Write a message...">
                    <button class="chatbox__send--footer send__button"><img src="./Images/Send-Button.png" alt="image" width="24" height="24"></button>
                </div>
            </div>
        </div>
        <div class="chatbox__button">
            <button><img src="./Images/ChatBot_Icon.png" width="110" height="110" /></button>
        </div>
    </div>
</div>

    <script src="./app.js"></script>

</body>
</html>
